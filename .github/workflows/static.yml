# Deploy static content to GitHub Pages — GATED on the E2E test suite.
# V1_166: previously this ran on every push to main with NO dependency on
# test.yml, so a commit that broke the Playwright suite still deployed to
# production. Now it runs only after the "E2E tests" workflow COMPLETES
# SUCCESSFULLY on main (or via manual dispatch). Red tests no longer ship.
name: Deploy static content to Pages

on:
  # Runs after the E2E test suite finishes on main; the job below only
  # deploys when that run concluded 'success'.
  workflow_run:
    workflows: ["E2E tests"]
    branches: ["main"]
    types: [completed]

  # Manual escape hatch (e.g. deploy a docs-only change, or re-deploy).
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # Deploy only if the triggering test run passed, or if invoked manually.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
