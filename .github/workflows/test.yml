name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: this is a read-only test workflow (checkout +
# run Playwright + upload a report artifact on failure) — it needs no write
# scopes. Resolves the CodeQL "Workflow does not contain permissions" alert.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright critical paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium --project=mobile-android --project=mobile-ios --project=ipad-mini-landscape --project=ipad-pro-portrait
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
