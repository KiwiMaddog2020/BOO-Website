// ===== TILE RENDER =====
function drawTiles(){
  const atlas = TILE_ATLAS[room.area];
  const x0 = Math.max(0, Math.floor(cam.x/T)), x1 = Math.min(room.W-1, Math.ceil((cam.x+LW)/T));
  const y0 = Math.max(0, Math.floor(cam.y/T)), y1 = Math.min(room.H-1, Math.ceil((cam.y+LH)/T));
  const tNow = Date.now()*0.004;
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    const ch = room.grid[y][x];
    if (ch==='.') continue;
    const idx = TILE_IDX[ch];
    if (idx===undefined) continue;
    let oy = 0;
    for (const b of bumps){ if (b.tx===x && b.ty===y){ oy = -Math.sin((10-b.t)/10*Math.PI)*7; } }
    const dx2 = Math.round(x*T-cam.x), dy2 = Math.round(y*T-cam.y+oy);
    cx.drawImage(atlas, idx*T, 0, T, T, dx2, dy2, T, T);
    // living-tile overlays (cheap, no shadowBlur)
    if (ch==='?'||ch==='M'||ch==='U'){
      const p = 0.25+0.25*Math.sin(tNow*2 + x*0.9);
      cx.globalAlpha = p; cx.fillStyle = '#fff8d0';
      cx.fillRect(dx2+4, dy2+4, 4, 4);
      cx.globalAlpha = 1;
    } else if (ch==='~'){
      const w1 = Math.sin(tNow*3 + x*1.3)*3;
      cx.fillStyle = '#ffd24a';
      cx.fillRect(dx2+6+w1, dy2+4, 6, 2);
      cx.fillRect(dx2+20-w1, dy2+5, 4, 2);
    } else if (ch==='A'){
      // midway pennant: gold + waving once claimed, dim cyan before
      const claimed = G && G.midway;
      const wave = Math.sin(tNow*4)*2;
      cx.fillStyle = claimed ? COL.gold : 'rgba(0,255,255,0.45)';
      cx.beginPath();
      cx.moveTo(dx2+T/2+1, dy2+3);
      cx.lineTo(dx2+T/2+14+(claimed?wave:0), dy2+7);
      cx.lineTo(dx2+T/2+1, dy2+12);
      cx.closePath(); cx.fill();
    }
  }
  // pipe caps (draw lips on pipe tops)
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    if (room.grid[y][x]==='P' && tileAt(x,y-1)!=='P' && tileAt(x-1,y)!=='P'){
      const sx2 = x*T-cam.x, sy2 = y*T-cam.y;
      cx.shadowColor = COL.green; cx.shadowBlur = 6;
      cx.strokeStyle = COL.green; cx.lineWidth = 2;
      cx.strokeRect(sx2-3, sy2, T*2+6, 10);
      cx.fillStyle = '#0a3a14'; cx.fillRect(sx2-2, sy2+1, T*2+4, 8);
      cx.shadowBlur = 0;
    }
  }
}
function drawGoalBar(){
  if (!G.goal) return;
  const g = G.goal;
  const xl = g.xL*T+T/2-cam.x, xr = g.xR*T+T/2-cam.x;
  // shimmering energy field between the posts
  const sh = 0.05 + 0.04*Math.sin(Date.now()*0.004);
  cx.globalAlpha = sh;
  cx.fillStyle = COL.gold;
  cx.fillRect(xl, g.top-cam.y, xr-xl, g.bot-g.top);
  cx.globalAlpha = 1;
  // the bonus bar
  cx.shadowColor = COL.gold; cx.shadowBlur = 10;
  cx.strokeStyle = COL.gold; cx.lineWidth = 3.5;
  cx.beginPath();
  cx.moveTo(xl, g.barY-cam.y);
  cx.lineTo(xr, g.barY-cam.y);
  cx.stroke();
  cx.shadowBlur = 0;
  // bar end sparks
  cx.fillStyle = '#fff';
  cx.fillRect(xl-2, g.barY-cam.y-2, 4, 4);
  cx.fillRect(xr-2, g.barY-cam.y-2, 4, 4);
}
function drawBG(){
  const bg = BGS[room.area];
  cx.drawImage(bg.far, 0, 0); // far layer is viewport sized already (512 wide -> tile)
  const fx = -(cam.x*0.15)%512;
  cx.drawImage(bg.far, fx, 0); cx.drawImage(bg.far, fx+512, 0);
  if (fx+1024 < LW) cx.drawImage(bg.far, fx+1024, 0);

  cx.drawImage(bg.mid, mx, my); cx.drawImage(bg.mid, mx+512, my);

}

// ===== LEVEL SCENE =====
function updateLevel(){
  if (input.pauseEdge && !G.ending && !player.dead){ G.paused = !G.paused; AU.sfx.pause(); }
  if (G.paused) return;
  if (hitPause > 0){ hitPause--; return; } // hit-stop: world frozen, render continues
  G.frame++;
  if (G.nameBanner>0) G.nameBanner--;
  if (G.bossBanner>0) G.bossBanner--;
  // timer
  if (G.timer != null && !G.ending && !player.dead){
    G.timer -= 1/60;
    if (G.timer <= 100 && !G.hurry){ G.hurry = true; AU.sfx.hurry(); AU.setFast(true); }
    if (G.timer <= 0){ G.timer = 0; player.die(true); }
  }
  player.update();
  // reset stomp chain when grounded
  if (player.onGround) stompChain = 0;
  // midway check
  if (!G.midway && !player.dead){
    const ptx = Math.floor((player.x+player.w/2)/T);
    const pty = Math.floor((player.y+player.h/2)/T);
    for (let dy=-1;dy<=1;dy++){
      if (tileAt(ptx,pty+dy)==='A'){
        G.midway = true; midwayFlags[G.id] = true;
        AU.sfx.key(); pop(player.x, player.y-10, 'CHECKPOINT', COL.cyan);
        puff(ptx*T+T/2, (pty+dy)*T+8, COL.cyan, 8, 1.6, 20);
      }
    }
  }
  // goal bar
  if (G.goal && !G.ending){
    const g = G.goal;
    g.barY += g.dir; if (g.barY<g.top||g.barY>g.bot-6) g.dir=-g.dir;
    const barRect = { x:g.xL*T+T/2, y:g.barY-4, w:(g.xR-g.xL)*T, h:8 };
    const between = player.x+player.w > g.xL*T && player.x < g.xR*T+T;
    if (between && overlaps(player, barRect)){
      levelClear(1 - (g.barY-g.top)/(g.bot-g.top));
    } else if (!player.dead && between && player.onGround && player.x > g.xL*T){
      levelClear(0.05); // walked through under the bar — still a clear
    }
  }
  if (player.climbingGoal){
    G.clearT = (G.clearT||0)+1;
    if (G.clearT===1){ puff(player.x+player.w/2, player.y, COL.gold, 14, 2.4, 30); }
    // celebration fireworks while walking off
    if (G.clearT%22===0 && G.clearT<100){
      puff(player.x+rnd(-70,90), player.y-rnd(30,110),
           [COL.gold,COL.cyan,COL.magenta][(G.clearT/22)%3|0], 10, 2.2, 26);
      AU.sfx.coin();
    }
    if (G.clearT>110){
      player.climbingGoal = false;
      irisClose(()=>{ exitToMap(false); }, player.x+player.w/2-cam.x, player.y-cam.y);
      G.clearT = -999;
    }
  }
  // switch shrine clear
  if (G.switchDone>0){
    G.switchDone--;
    if (G.switchDone===0){
      save.cleared[G.id]=true; writeSave();
      G.ending = true;
      setTimeout(()=>{ irisClose(()=>exitToMap(false)); }, 900);
    }
  }
  // entities
  for (const e of ents) if (!e.dead) updateEnt(e);
  ents = ents.filter(e=>!e.dead);
  updateFireballs();
  updateCrumbles();
  for (const b of bumps) b.t--;
  bumps = bumps.filter(b=>b.t>0);
  updateParts(); updatePops();
  camUpdate(player);
}
function drawLevel(){
  drawBG();
  cx.save();
  if (cam.shakeT>0) cx.translate(rnd(-cam.shakeA,cam.shakeA), rnd(-cam.shakeA,cam.shakeA));
  drawTiles();
  drawGoalBar();

  // fireballs

  }
  // carried key on top (shells already draw in the ents pass at their carried position)
  if (player.carry && player.carry.kind==='key'){

  }
  // dark rooms: radial light around the player
  if (room.meta.dark){
    const px = player.x+player.w/2-cam.x, py = player.y+player.h/2-cam.y;
    const grad = cx.createRadialGradient(px,py,60, px,py,290);

    cx.fillStyle = grad; cx.fillRect(0,0,LW,LH);
  }
  drawHUD(G);
  // level name banner
  if (G.nameBanner>0){
    cx.globalAlpha = Math.min(1, G.nameBanner/30);
    cx.font = '800 22px Oxanium'; cx.textAlign='center';
    cx.fillStyle = COL.cyan; cx.shadowColor = COL.cyan; cx.shadowBlur = 14;

    cx.shadowBlur = 0; cx.globalAlpha = 1;
  }
  if (G.bossBanner>0 && G.boss){
    cx.globalAlpha = Math.min(1, G.bossBanner/30);
    cx.font = '800 26px Oxanium'; cx.textAlign='center';
    const bn = G.boss.kind==='brute' ? 'PRISM BRUTE' : 'VOLT WYRM';
    cx.fillStyle = COL.red; cx.shadowColor = COL.red; cx.shadowBlur = 16;
    cx.fillText('⚠ '+bn+' ⚠', LW/2, 80);
    cx.shadowBlur = 0; cx.globalAlpha = 1;
  }
  if (G.paused){
    cx.fillStyle = 'rgba(0,0,8,0.72)'; cx.fillRect(0,0,LW,LH);
    cx.font='800 34px Oxanium'; cx.textAlign='center';
    cx.fillStyle = COL.cyan; cx.shadowColor=COL.cyan; cx.shadowBlur=16;
    cx.fillText('PAUSED', LW/2, LH/2-10);
    cx.shadowBlur = 0;
    cx.font = '600 14px Oxanium'; cx.fillStyle = '#9fd8e8';
    cx.fillText('P / ENTER — RESUME      M — MUTE', LW/2, LH/2+26);
  }
}

// ===== OVERWORLD SCENE =====
function updateMap(){
  if (mapToken.moving){
    const m = mapToken.moving;
    m.t += 0.035;
    if (m.t>=1){
      mapToken.node = m.to; save.node = m.to; writeSave();
      const n = nodeById(m.to); mapToken.x=n.x; mapToken.y=n.y;
      mapToken.moving = null;
    } else {
      const a = nodeById(m.from), b2 = nodeById(m.to);
      const tt = m.t<0.5 ? 2*m.t*m.t : 1-Math.pow(-2*m.t+2,2)/2;
      mapToken.x = lerp(a.x,b2.x,tt); mapToken.y = lerp(a.y,b2.y,tt) - Math.sin(m.t*Math.PI*4)*4;
    }
    return;
  }
  // choose a neighbor by pressed direction
  let want = null;
  if (input.l) want={dx:-1,dy:0}; else if (input.r) want={dx:1,dy:0};
  else if (input.u) want={dx:0,dy:-1}; else if (input.d) want={dx:0,dy:1};
  if (want){
    const cur = nodeById(mapToken.node);
    let best=null, bestDot=0.45;
    for (const e of MAP_EDGES){
      if (!edgeVisible(e)) continue;
      let other = null;
      if (e[0]===mapToken.node) other=e[1];
      else if (e[1]===mapToken.node) other=e[0];
      if (!other) continue;
      // may travel if either end cleared or target unlocked
      if (!(save.cleared[mapToken.node] || save.cleared[other] || nodeUnlocked(other))) continue;
      const n = nodeById(other);
      const dx=n.x-cur.x, dy=n.y-cur.y, len=Math.hypot(dx,dy)||1;
      const dot = (dx/len)*want.dx + (dy/len)*want.dy;
      if (dot>bestDot){ bestDot=dot; best=other; }
    }
    if (best){ mapToken.moving = {from:mapToken.node, to:best, t:0}; input.l=input.r=input.u=input.d=0; }
  }
  if ((input.jumpEdge || input.spinEdge)){
    const id = mapToken.node;
    if (LEVELS[id] && nodeUnlocked(id)){
      // shrine can only be done once
      if (id==='shrine' && save.cleared['shrine']){ AU.sfx.bump(); return; }
      AU.stopSong(); AU.sfx.pipe();
      irisClose(()=>{ startLevel(id); });
    }
  }
}

      cx.restore();
    } else {

      cx.strokeStyle = cleared ? COL.gold : COL.cyan; cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(n.x,n.y,10,0,TAU); cx.stroke();
    }
    cx.shadowBlur = 0; cx.globalAlpha = 1;
  }
  // current node ring
  { const n = nodeById(mapToken.node);

  // token: mini boo
  { const x = mapToken.x, y = mapToken.y - 22;
    cx.shadowColor = COL.cyan; cx.shadowBlur = 10;
    cx.fillStyle = COL.cyan;
    cx.beginPath(); cx.arc(x, y, 9, Math.PI, 0);
    cx.quadraticCurveTo(x+9, y+9, x+5, y+8);
    cx.quadraticCurveTo(x, y+11, x-5, y+8);
    cx.quadraticCurveTo(x-9, y+9, x-9, y);
    cx.closePath(); cx.fill();
    cx.shadowBlur = 0;
    cx.fillStyle = '#04222a';
    cx.beginPath(); cx.arc(x-3,y-1,1.8,0,TAU); cx.arc(x+3,y-1,1.8,0,TAU); cx.fill(); }
  // banner
  { const n = nodeById(mapToken.node);
    cx.fillStyle = 'rgba(4,8,18,0.85)'; cx.fillRect(0,LH-64,LW,64);
    cx.strokeStyle = 'rgba(0,255,255,0.4)'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(0,LH-64); cx.lineTo(LW,LH-64); cx.stroke();
    cx.font='800 18px Oxanium'; cx.textAlign='left';

    cx.font='600 12px Oxanium'; cx.fillStyle='#9fd8e8';
    cx.fillText(nodeUnlocked(n.id) ? 'JUMP — ENTER   ARROWS — TRAVEL' : 'LOCKED', 24, LH-18);
    // per-level BOO pips
    const mask = save.boo[n.id]||0;
    if (['1-1','1-2','1-3','2-1','2-2','2-3','2-4'].includes(n.id)){
      for (let i=0;i<5;i++){
        cx.globalAlpha = (mask>>i&1)?1:0.25;
        cx.drawImage(SPR.booCoin, LW-160+i*28, LH-52, 20, 23);

  }
  cx.font='800 20px Oxanium'; cx.fillStyle=COL.cyan;
  cx.fillText('BOO COINS  '+booGot+' / '+booTotal, LW/2, 262);
  cx.fillText('SCORE  '+save.score, LW/2, 292);
  cx.font='800 26px Oxanium'; cx.fillStyle=COL.magenta;
  cx.shadowColor=COL.magenta; cx.shadowBlur=14;
  cx.fillText('THE END — FOR NOW', LW/2, 348);
  cx.shadowBlur=0;
  if (endT>240 && (endT>>5)%2===0){
    cx.font='600 13px Oxanium'; cx.fillStyle='#9fd8e8';
    cx.fillText('PRESS JUMP', LW/2, 390);
  }
}
// ===== GAME OVER =====
function updateGameover(){
  goT++;
  if (goT>60 && (input.jumpEdge||input.pauseEdge)){
    save.lives = 5; writeSave();
    AU.sfx.oneUp();
    irisClose(()=>exitToMap(false));
  }
}
function drawGameover(){
  cx.fillStyle='#08040a'; cx.fillRect(0,0,LW,LH);
  cx.textAlign='center';
  cx.font='800 52px Oxanium'; cx.fillStyle=COL.red;
  cx.shadowColor=COL.red; cx.shadowBlur=20;
  cx.fillText('GAME OVER', LW/2, LH/2-20);
  cx.shadowBlur=0;
  if (goT>60 && (goT>>5)%2===0){
    cx.font='600 15px Oxanium'; cx.fillStyle='#e8c8d8';
    cx.fillText('PRESS JUMP TO CONTINUE — YOUR MAP IS SAFE', LW/2, LH/2+34);
  }
}

// ===== MAIN LOOP =====
let acc = 0, lastT = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  let dt = ts - lastT; lastT = ts;
  if (dt > 200) dt = 200;
  acc += dt;
  let steps = 0;
  while (acc >= 1000/60 && steps < 4){
    step(); acc -= 1000/60; steps++;
  }
  render();
}
function step(){
  updateIris();
  if (iris.dir===-1){ clearEdges(); return; } // hold world during close
  switch(scene){
    case 'title': updateTitle(); if (AU.songName!=='title') AU.ensureSong('title'); break;
    case 'map': updateMap(); break;
    case 'level': updateLevel(); break;
    case 'end': updateEnd(); break;
    case 'gameover': updateGameover(); break;
  }
  clearEdges();
}
function render(){
  cx.clearRect(0,0,LW,LH);
  switch(scene){
    case 'title': drawTitle(); break;
    case 'map': drawMap(); break;
    case 'level': if (room) drawLevel(); break;
    case 'end': drawEnd(); break;
    case 'gameover': drawGameover(); break;
  }
  drawIris();
}

// ===== DEBUG API (used by automated tests; harmless in production) =====
window.__bw = {
  get scene(){ return scene; }, get G(){ return G; }, get room(){ return room; },
  get player(){ return player; }, get save(){ return save; }, get ents(){ return ents; },
  LEVELS, input,
  warp(id){ AU.stopSong(); startLevel(id); },
  toMap(){ exitToMap(false); },
  grant(n){ player.form = n; player.syncSize(); },
  clearNode(id){ save.cleared[id]=true; writeSave(); },
  win(){ if (G) levelClear(1); },
  reset(){ try{ localStorage.removeItem(SAVE_KEY);}catch(e){} }
};

// ===== BOOT =====
irisOpen();
requestAnimationFrame(frame);
</script>
