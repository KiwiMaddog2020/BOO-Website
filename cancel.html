<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Checkout Cancelled — Bunch of Others</title>
    <meta name="robots" content="noindex">
    <!-- Favicons (match main site) -->
    <link rel="icon" href="Images/Favicon/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="Images/Favicon/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="Images/Favicon/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            text-align: center;
            background:
                radial-gradient(ellipse at top right, rgba(255, 0, 255, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at bottom left, rgba(155, 48, 255, 0.12) 0%, transparent 55%),
                #0a0a0a;
        }

        .logo-mark {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            border-radius: 24px;
            background: #ff00ff;
            box-shadow:
                0 0 30px rgba(255, 0, 255, 0.5),
                0 0 60px rgba(255, 0, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem;
            animation: cancelBreathe 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .logo-mark img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            display: block;
        }

        @keyframes cancelBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 10vw, 5.5rem);
            letter-spacing: 0.12em;
            color: #ffffff;
            text-shadow:
                0 0 20px rgba(255, 0, 255, 0.9),
                0 0 40px rgba(255, 0, 255, 0.6),
                0 0 80px rgba(0, 255, 255, 0.35);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: clamp(1rem, 2.6vw, 1.3rem);
            color: rgba(255, 255, 255, 0.88);
            font-weight: 300;
            letter-spacing: 0.04em;
            margin-bottom: 2rem;
            max-width: 32rem;
            line-height: 1.55;
        }

        .detail {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.58);
            margin-bottom: 2.5rem;
            max-width: 28rem;
            line-height: 1.6;
        }

        .button-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid #00ffff;
            border-radius: 30px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn.secondary {
            border-color: #ff00ff;
        }

        @media (hover: hover) {
            .action-btn:hover {
                background: #00ffff;
                color: #0a0a0a;
                box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
                transform: translateY(-2px);
            }
            .action-btn.secondary:hover {
                background: #ff00ff;
                box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-mark { animation: none !important; }
            .action-btn { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="logo-mark">
        <img src="Images/BOO_LogoTransparent.png" alt="BOO">
    </div>
    <h1>NO WORRIES</h1>
    <p class="subtitle">Checkout was cancelled. Nothing was charged.</p>
    <p class="detail">If something went wrong or you changed your mind, you can head back to the merch page any time. Thanks for stopping by.</p>
    <div class="button-row">
        <a href="/#merch" class="action-btn">Back to Merch</a>
        <a href="/" class="action-btn secondary">Home</a>
    </div>
</body>
</html>
