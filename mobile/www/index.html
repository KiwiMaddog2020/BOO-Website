<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>BOO Arcade</title>
    <!-- Phase 1: Brickbreaker only. Phase 2 unhides the rest of the .game-tile entries. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <!-- V1_91: Splash veil with animated ghost.
         The Capacitor static splash is the bridge during WKWebView load;
         this veil takes over once HTML has parsed, animating the ghost in
         with a scale-bounce + glow-pulse before dissolving to reveal the menu. -->
    <div class="splash-veil" id="splash-veil">
        <img class="splash-ghost" src="./Images/Favicon/apple-touch-icon.png" alt="" aria-hidden="true">
    </div>

    <!-- Ambient psychedelic backdrop -->
    <div class="ambient-bg">
        <div class="ambient-halo halo-cyan"></div>
        <div class="ambient-halo halo-magenta"></div>
        <div class="ambient-halo halo-orange"></div>
        <div class="ambient-halo halo-purple"></div>
    </div>

    <!-- Arcade title -->
    <header class="arcade-header">
        <h1 class="arcade-title">BOO<br>ARCADE</h1>
        <p class="arcade-tagline">Bunch of Others</p>
    </header>

    <!-- Game tiles. Phase 1: only Brickbreaker has data-active="1". Others are styled
         as "coming soon" disabled tiles to demonstrate the full arcade scope to App
         Review without each game being shippable yet. -->
    <main class="arcade-main">
        <div class="game-grid">
            <button class="game-tile" data-game="Games/neon-brickbreaker.html" data-active="1">
                <span class="game-tile-name">Brickbreaker</span>
                <span class="game-tile-status">Play</span>
            </button>

            <button class="game-tile" data-game="Games/neon-survivors.html" data-active="1">
                <span class="game-tile-name">Survivors</span>
                <span class="game-tile-status">Play</span>
            </button>

            <button class="game-tile" data-game="Games/neon-tower-defense.html" data-active="1">
                <span class="game-tile-name">Tower Defense</span>
                <span class="game-tile-status">Play</span>
            </button>

            <button class="game-tile" data-game="Games/neon-dig.html" data-active="1">
                <span class="game-tile-name">Neon Dig</span>
                <span class="game-tile-status">Play</span>
            </button>

            <button class="game-tile" data-game="Games/neon-snake.html" data-active="1">
                <span class="game-tile-name">Snake Racing</span>
                <span class="game-tile-status">Play</span>
            </button>

            <button class="game-tile" data-game="Games/clydes-big-jump.html" data-active="1">
                <span class="game-tile-name">Clyde's Big Jump</span>
                <span class="game-tile-status">Play</span>
            </button>

            <!-- V1_138: Space Shooter removed from arcade menu for now (kept commented for easy re-add)
            <button class="game-tile" data-game="Games/neon-space-shooter.html" data-active="1">
                <span class="game-tile-name">Space Shooter</span>
                <span class="game-tile-status">Play</span>
            </button>
            -->
        </div>
    </main>

    <footer class="arcade-footer">
        <span class="arcade-version">v0.2 — Phase 2 build</span>
    </footer>

    <!-- Hidden iframe for in-app gameplay. menu.js sets src on tile tap and shows
         this; back gesture or X button returns to menu. Game files come from
         www/Games/ which build-www.sh syncs from the canonical Games/ directory. -->
    <div class="game-shell" id="game-shell" aria-hidden="true">
        <button class="game-shell-back" id="game-shell-back" aria-label="Back to arcade menu">✕</button>
        <iframe class="game-shell-frame" id="game-shell-frame" title="Game" allow="autoplay; fullscreen"></iframe>
    </div>

    <script type="module" src="menu.js"></script>
</body>
</html>
